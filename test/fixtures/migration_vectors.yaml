# Each value is a base64 protobuf MigrationPayload, exactly as Google
# Authenticator embeds it in otpauth-migration://offline?data=<value>.

# A single SHA1/TOTP/6-digit account — the common case.
single_totp_sha1: >-
  CjIKCkhlbGxvId6tvu8SFkdpdEh1YjphZGFAZXhhbXBsZS5jb20aBkdpdEh1YiABKAEwAhABGAEo0oXYzAQ=

# Two accounts in one payload: SHA1/6-digit and SHA256/8-digit.
two_accounts: >-
  CjIKCkhlbGxvId6tvu8SFkdpdEh1YjphZGFAZXhhbXBsZS5jb20aBkdpdEh1YiABKAEwAgo0CgpIZWxsbyHerb7vEhhHaXRMYWI6Z3JhY2VAZXhhbXBsZS5jb20aBkdpdExhYiACKAIwAhABGAIo0oXYzAQ=

# A counter-based (HOTP) account carrying a counter.
hotp_with_counter: >-
  Ch8KCkhlbGxvId6tvu8SA2FkYRoEQmFuayABKAEwATgqEAEYASjShdjMBA==

# SHA512 with 8 digits.
sha512_eight_digits: >-
  Ch0KCkhlbGxvId6tvu8SA2FkYRoEQWNtZSADKAIwAhABGAEo0oXYzAQ=

# No issuer field; the name carries 'Issuer:Account'.
