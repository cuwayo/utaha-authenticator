name: utaha_authenticator
description: "Utaha Authenticator — a free, open-source, offline-first two-factor authentication app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  collection: ^1.19.1
  convert: ^3.1.2
  crypto: ^3.0.7
  cryptography: ^2.9.0
  device_info_plus: ^13.3.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  dynamic_color: ^1.9.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  image_picker: ^1.2.4
  intl: any
  local_auth: ^3.0.2
  meta: ^1.18.3
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  protobuf: ^6.1.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.17.0
  drift_dev: ^2.35.1
  fake_async: any
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_annotation: ^4.9.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/icon/icon.png
  generate: true
  uses-material-design: true
